<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Starfall Courier</title><style>body{margin:0;background:#080d22;color:#e7f9ff;font-family:system-ui;display:grid;place-items:center;min-height:100vh}#wrap{position:relative;width:min(960px,100vw)}canvas{display:block;width:100%;image-rendering:pixelated;border:3px solid #597592;box-sizing:border-box;box-shadow:0 15px 70px #000}button{background:#ffd66b;color:#20213a;border:0;border-radius:8px;padding:13px 34px;font-weight:900;font-size:19px;cursor:pointer;box-shadow:0 5px #b57d4e}button:hover{filter:brightness(1.15)}.emblem{font-size:40px}#music.off{color:#ffadac}#overlay[hidden]{display:none}#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#090f26c9;text-align:center}#panel{padding:26px 45px;max-width:600px}h1{font-size:clamp(35px,6vw,65px);line-height:1;margin:10px;color:#ffdb78;text-shadow:4px 5px #ce6890}p{line-height:1.6}.small{color:#a8b9d3;font-size:14px}#music{position:absolute;right:15px;top:13px;padding:8px 12px;font-size:13px;box-shadow:none;background:#273957;color:#effaff;border:1px solid #799cb7;z-index:2}</style><div id="wrap"><canvas id="game" width="960" height="540"></canvas><button id="music">♫ MUSIC ON</button><div id="overlay"><div id="panel"><div class="emblem">✦ ☄ ✦</div><h1 id="heading">STARFALL<br>COURIER</h1><p id="message">A tiny courier, three wild skies, and one long journey home.<br>Gather starlight. Dodge the shadow sentries. Reach the beacon!</p><button id="start">START GAME</button><p class="small">A / D or ← / → move · SPACE jump · M music</p></div></div></div><script src="game.js"></script></html>
